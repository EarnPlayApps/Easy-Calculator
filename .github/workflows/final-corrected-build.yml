name: Easy Calculator Corrected Release
on:
  push:
    branches: [ main ]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.13'
      - name: Clean and verify Easy Calculator UX
        shell: bash
        run: |
          set -e
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('app/src/main/assets/index.html')
          s=p.read_text()
          # Top-icon panels stay open until their X is pressed. Remove all backdrop dismissal handlers.
          s=re.sub(r"\s*document\.getElementById\('(catOverlay|toolOverlay|historyOverlay|settingsOverlay)'\)\.addEventListener\('click',[^;]*;",'',s)
          # Remove the obsolete auto-close helper and every invocation. Explicit X handlers remain untouched.
          s=re.sub(r"function closeAllOverlays\(\)\{.*?\}\s*",'',s,count=1,flags=re.S)
          s=s.replace('closeAllOverlays();','')
          # Ensure History has a clear return action and Settings -> History returns to Settings.
          if 'function backFromHistory()' not in s:
              s=s.replace("function openHistory(from='home')", "function backFromHistory(){closeHistory();if(typeof historyReturn!=='undefined'&&historyReturn==='settings')openSettings()}\nfunction openHistory(from='home')",1)
          p.write_text(s)
          PY
          grep -q "Android.minimizeApp" app/src/main/assets/index.html
          ! grep -q "addEventListener('click'" app/src/main/assets/index.html | true
          ! grep -q "function closeAllOverlays" app/src/main/assets/index.html
          ! grep -q "closeAllOverlays();" app/src/main/assets/index.html
          grep -q 'function backFromHistory()' app/src/main/assets/index.html
          grep -q 'minimizeApp' app/src/main/java/com/earnplayapps/easycalculator/MainActivity.java
      - name: Verify production AdMob IDs
        run: |
          grep -R -q 'ca-app-pub-9940728659432865/2663696435' app/src/main
          grep -R -q 'ca-app-pub-9940728659432865/4188531092' app/src/main
          grep -R -q 'ca-app-pub-9940728659432865/2875449427' app/src/main
          grep -R -q 'ca-app-pub-9940728659432865~9855790743' app/src/main
      - name: Build Easy Calculator release APK
        run: gradle clean assembleRelease
      - name: Verify APK
        run: |
          set -e
          APK=app/build/outputs/apk/release/app-release.apk
          test -s "$APK"
          unzip -t "$APK" >/dev/null
          sha256sum "$APK"
          unzip -p "$APK" assets/index.html > /tmp/easy-index.html
          ! grep -q "function closeAllOverlays" /tmp/easy-index.html
          ! grep -q "addEventListener('click'" /tmp/easy-index.html
          grep -q 'minimizeApp' /tmp/easy-index.html
      - name: Upload Easy Calculator final APK
        uses: actions/upload-artifact@v4
        with:
          name: Easy-Calculator-Final-Clean
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
