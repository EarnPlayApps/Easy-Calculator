name: Easy Calculator Corrected Release
on:
  push:
    branches: [ main ]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.13'
      - name: Apply corrected overlay behavior
        shell: bash
        run: |
          set -e
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('app/src/main/assets/index.html')
          s=p.read_text()
          # Top-icon panels must stay open until their X is pressed; no backdrop dismissal.
          s=re.sub(r"\s*document\.getElementById\('(?:catOverlay|toolOverlay|historyOverlay|settingsOverlay)'\)\.addEventListener\('click',[^;]+;",'',s)
          # Do not auto-close panels when another top action is invoked.
          s=re.sub(r"function closeAllOverlays\(\)\{.*?\}","function closeAllOverlays(){}",s,count=1,flags=re.S)
          # Keep explicit Settings -> History navigation and History back button.
          if 'function backFromHistory()' not in s:
              s=s.replace("function openHistory(from='home')", "function backFromHistory(){closeHistory();if(typeof historyReturn!=='undefined'&&historyReturn==='settings')openSettings()}\nfunction openHistory(from='home')",1)
          p.write_text(s)
          j=Path('app/src/main/java/com/earnplayapps/easycalculator/MainActivity.java')
          t=j.read_text()
          if 'minimizeApp()' not in t:
              t=t.replace('@JavascriptInterface public void showRewardedAd(){runOnUiThread(()->showReward());}', '@JavascriptInterface public void showRewardedAd(){runOnUiThread(()->showReward());}\n  @JavascriptInterface public void minimizeApp(){runOnUiThread(()->{try{moveTaskToBack(true);}catch(Exception ignored){}});}',1)
          j.write_text(t)
          PY
          grep -q "Android.minimizeApp" app/src/main/assets/index.html
          ! grep -q "catOverlay').addEventListener('click'" app/src/main/assets/index.html
          ! grep -q "toolOverlay').addEventListener('click'" app/src/main/assets/index.html
          ! grep -q "historyOverlay').addEventListener('click'" app/src/main/assets/index.html
          ! grep -q "settingsOverlay').addEventListener('click'" app/src/main/assets/index.html
          grep -q 'minimizeApp' app/src/main/java/com/earnplayapps/easycalculator/MainActivity.java
      - name: Verify production AdMob IDs
        run: |
          grep -R -q 'ca-app-pub-9940728659432865/2663696435' app/src/main
          grep -R -q 'ca-app-pub-9940728659432865/4188531092' app/src/main
          grep -R -q 'ca-app-pub-9940728659432865/2875449427' app/src/main
          grep -R -q 'ca-app-pub-9940728659432865~9855790743' app/src/main
      - name: Build Easy Calculator release APK
        run: gradle clean assembleRelease
      - name: Verify APK
        run: |
          test -s app/build/outputs/apk/release/app-release.apk
          unzip -t app/build/outputs/apk/release/app-release.apk >/dev/null
          sha256sum app/build/outputs/apk/release/app-release.apk
      - name: Upload Easy Calculator final APK
        uses: actions/upload-artifact@v4
        with:
          name: Easy-Calculator-Final-Corrected
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
