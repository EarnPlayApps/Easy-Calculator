name: Fix Easy Calculator two UI details

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix-ui:
    if: ${{ !contains(github.event.head_commit.message, 'Fix Easy Calculator two UI details') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Apply only requested UI changes
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path('app/src/main/assets/index.html')
          s = p.read_text(encoding='utf-8')

          # Remove Calculator Lain search only.
          s, n = re.subn(r'<input[^>]*class=["\']search["\'][^>]*>', '', s, count=1)
          if n != 1:
              raise SystemExit('Calculator Lain search input not found exactly once')

          # History: match Calculator Lain pill style without changing its function.
          style = '''<style id="easy-history-match">
          #historyBtn{border:1px solid #f0d7bb!important;background:#fff8f0!important;color:#b96500!important;border-radius:999px!important;padding:8px 11px!important;width:auto!important;height:34px!important;font-size:11px!important;font-weight:800!important;white-space:nowrap!important;display:inline-flex!important;align-items:center!important;justify-content:center!important;gap:5px!important;box-shadow:none!important}
          #historyBtn:active{transform:translateY(1px)}
          #historyBtn svg{width:14px!important;height:14px!important;fill:none!important;stroke:currentColor!important;stroke-width:1.9!important;stroke-linecap:round!important;stroke-linejoin:round!important}
          #historyBtn::after{content:"History";display:inline-block;font-size:11px;font-weight:800;line-height:1}
          #other{display:inline-flex!important;align-items:center!important;justify-content:center!important;gap:5px!important}
          #other svg{width:14px!important;height:14px!important;fill:none!important;stroke:currentColor!important;stroke-width:1.9!important;stroke-linecap:round!important;stroke-linejoin:round!important}
          </style>'''
          s = re.sub(r'<style id="easy-history-match">.*?</style>', '', s, flags=re.S)
          s = s.replace('</head>', style + '</head>', 1)

          # Add one matching SVG calculator icon to Calculator Lain, preserving the button/id/text/function.
          pat = r'<button([^>]*\bid=["\']other["\'][^>]*)>\s*(?:<svg.*?</svg>)?\s*Calculator Lain\s*</button>'
          repl = r'<button\1><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="3" width="14" height="18" rx="3"/><path d="M8 7h8M8 11h3M13 11h3M8 15h3M13 15h3M8 19h8"/></svg>Calculator Lain</button>'
          s, n = re.subn(pat, repl, s, count=1, flags=re.S)
          if n != 1:
              raise SystemExit('Calculator Lain button not found exactly once')

          p.write_text(s, encoding='utf-8')
          PY

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/assets/index.html
          git diff --cached --quiet && exit 0
          git commit -m "Fix Easy Calculator two UI details"
          git push
