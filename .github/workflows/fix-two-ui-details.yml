name: Fix Easy Calculator two UI details

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix-ui:
    if: ${{ !contains(github.event.head_commit.message, 'Fix Easy Calculator two UI details') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Apply only requested UI changes
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path('app/src/main/assets/index.html')
          s = p.read_text(encoding='utf-8')

          # Remove only the Calculator Lain search field.
          s, n = re.subn(r'<input[^>]*class=["\']search["\'][^>]*>', '', s, count=1)
          if n != 1:
              raise SystemExit('Expected Calculator Lain search input was not found exactly once')

          # Make History visually match the existing Calculator Lain pill.
          pattern = r'\.historyBtn\{[^}]*\}\.historyBtn:active\{[^}]*\}\.historyBtn svg\{[^}]*\}'
          replacement = '.historyBtn{border:1px solid #f0d7bb;background:#fff8f0;color:#b96500;border-radius:999px;padding:8px 11px;font-size:11px;font-weight:800;white-space:nowrap;display:inline-flex;align-items:center;justify-content:center;gap:5px;box-shadow:none}.historyBtn:active{transform:translateY(1px)}.historyBtn svg{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}'
          s, n = re.subn(pattern, replacement, s, count=1)
          if n != 1:
              raise SystemExit('Expected History button CSS was not found exactly once')

          # Keep the existing history icon and add a small text label.
          old = '</svg></button><button class="other" id="other">Calculator Lain</button>'
          new = '</svg><span>History</span></button><button class="other" id="other">Calculator Lain</button>'
          if old not in s:
              raise SystemExit('Expected History button markup was not found')
          s = s.replace(old, new, 1)

          p.write_text(s, encoding='utf-8')
          PY

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/assets/index.html
          git diff --cached --quiet && exit 0
          git commit -m "Fix Easy Calculator two UI details"
          git push
