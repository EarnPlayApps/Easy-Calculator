name: Fix Easy Calculator two UI details

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix-ui:
    if: ${{ !contains(github.event.head_commit.message, 'Fix Easy Calculator two UI details') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Apply only requested UI changes
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path('app/src/main/assets/index.html')
          s = p.read_text(encoding='utf-8')

          # Remove only the Calculator Lain search field.
          s, n = re.subn(r'<input[^>]*class=["\']search["\'][^>]*>', '', s, count=1)
          if n != 1:
              raise SystemExit('Expected Calculator Lain search input was not found exactly once')

          # Override only the History button so it uses the same compact pill treatment as Calculator Lain.
          style = '''<style id="easy-history-match">
          #historyBtn{border:1px solid #f0d7bb!important;background:#fff8f0!important;color:#b96500!important;border-radius:999px!important;padding:8px 11px!important;width:auto!important;height:34px!important;font-size:11px!important;font-weight:800!important;white-space:nowrap!important;display:inline-flex!important;align-items:center!important;justify-content:center!important;gap:5px!important;box-shadow:none!important}
          #historyBtn:active{transform:translateY(1px)}
          #historyBtn svg{width:14px!important;height:14px!important;fill:none!important;stroke:currentColor!important;stroke-width:1.9!important;stroke-linecap:round!important;stroke-linejoin:round!important}
          #historyBtn::after{content:"History";display:inline-block;font-size:11px;font-weight:800;line-height:1}
          </style>'''
          s = re.sub(r'<style id="easy-history-match">.*?</style>', '', s, flags=re.S)
          marker = '</head>'
          if marker not in s:
              raise SystemExit('HTML head marker not found')
          s = s.replace(marker, style + marker, 1)

          p.write_text(s, encoding='utf-8')
          PY

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/assets/index.html
          git diff --cached --quiet && exit 0
          git commit -m "Fix Easy Calculator two UI details"
          git push
