name: Easy Calculator Exclusive Overlay Patch
on:
  push:
    branches: [ main ]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Patch overlay navigation
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('app/src/main/assets/index.html');s=p.read_text()
          if 'function closeAllOverlays()' not in s:
            s=s.replace("function openHistory(from='home')", "function closeAllOverlays(){['catOverlay','toolOverlay','historyOverlay','settingsOverlay'].forEach(id=>{const e=document.getElementById(id);if(e)e.classList.remove('show')})}\nfunction openHistory(from='home')")
          s=s.replace("function openHistory(from='home'){historyReturn=from;document.getElementById('historyList')", "function openHistory(from='home'){historyReturn=from;closeAllOverlays();document.getElementById('historyList')")
          s=s.replace("function openCats(){document.getElementById('catOverlay').classList.add('show');", "function openCats(){closeAllOverlays();document.getElementById('catOverlay').classList.add('show');")
          s=s.replace("function openSettings(){document.getElementById('settingsOverlay').classList.add('show');", "function openSettings(){closeAllOverlays();document.getElementById('settingsOverlay').classList.add('show');")
          s=s.replace("function openTool(id,title,desc){document.getElementById('toolTitle').textContent=title;", "function openTool(id,title,desc){closeAllOverlays();document.getElementById('toolTitle').textContent=title;")
          s=s.replace("document.getElementById('moreBtn').onclick=openHistory;", "document.getElementById('moreBtn').onclick=()=>openHistory('home');")
          p.write_text(s)
          PY
          grep -q 'function closeAllOverlays()' app/src/main/assets/index.html
          grep -q 'closeAllOverlays();document.getElementById' app/src/main/assets/index.html
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add app/src/main/assets/index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Easy Calculator: make top overlays mutually exclusive"
          git push origin HEAD:main