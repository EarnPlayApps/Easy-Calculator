name: Easy Calculator Final APK Build

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Apply locked final UI build fixes
        shell: bash
        run: |
          set -e
          python3 - <<'PY'
          from pathlib import Path
          p=Path('app/src/main/java/com/earnplayapps/easycalculator/MainActivity.java')
          s=p.read_text()
          marker='w.setWebViewClient(new WebViewClient(){'
          if marker in s:
            a=s.index(marker); b=s.index('w.setWebChromeClient',a)
            s=s[:a]+'''w.setWebViewClient(new WebViewClient(){@Override public void onPageFinished(WebView v,String u){w.setVisibility(View.VISIBLE);w.evaluateJavascript("(function(){var g=document.getElementById('gridBtn');if(g)g.onclick=openCalculator;var c=document.querySelector('.calcOtherKey');if(c){c.onclick=openCats;c.setAttribute('aria-label','Kalkulator lain');c.style.color='#f28a16';c.style.background='#fff8f0';c.style.borderColor='#f0d7bb'}})()",null);}});'''+s[b:]
            p.write_text(s)
          q=Path('app/src/main/assets/index.html'); h=q.read_text()
          h=h.replace('<button class="key soft" onclick="clearAll()" aria-label="Padam semua">AC</button>','<button class="key soft acKey" onclick="clearAll()" aria-label="Padam semua">AC</button>')
          h=h.replace("function openCats(){closeAllOverlays();","function openCats(){").replace("function openHistory(from='home'){historyReturn=from;closeAllOverlays();","function openHistory(from='home'){historyReturn=from;").replace("function openSettings(){closeAllOverlays();","function openSettings(){")
          for x in ["document.getElementById('catOverlay').addEventListener('click',e=>{if(e.target.id==='catOverlay')closeCats()});","document.getElementById('toolOverlay').addEventListener('click',e=>{if(e.target.id==='toolOverlay')closeTool()});","document.getElementById('historyOverlay').addEventListener('click',e=>{if(e.target.id==='historyOverlay')closeHistory()});","document.getElementById('settingsOverlay').addEventListener('click',e=>{if(e.target.id==='settingsOverlay')closeSettings()});"]: h=h.replace(x,'')
          if '.acKey{' not in h: h=h.replace('</style></head>',' .acKey{color:#d94b45!important} </style></head>')
          q.write_text(h)
          PY
      - name: Build Release APK
        run: gradle assembleRelease --stacktrace
      - name: Verify APK
        shell: bash
        run: |
          set -e
          apk=$(find app/build/outputs/apk/release -type f -name '*.apk' -print -quit)
          test -n "$apk"
          unzip -t "$apk" >/dev/null
          html=$(mktemp); unzip -p "$apk" assets/index.html > "$html"
          grep -q 'acKey' "$html"
          grep -q 'Android.minimizeApp' "$html"
          dex=$(mktemp); unzip -p "$apk" classes.dex > "$dex"
          strings "$dex" | grep -q 'moveTaskToBack'
          strings "$dex" | grep -q 'ca-app-pub-9940728659432865/2663696435'
          strings "$dex" | grep -q 'ca-app-pub-9940728659432865/4188531092'
          strings "$dex" | grep -q 'ca-app-pub-9940728659432865/2875449427'
          sha256sum "$apk"
          ls -lh "$apk"
      - name: Upload Easy Calculator final APK
        uses: actions/upload-artifact@v4
        with:
          name: Easy-Calculator-Final-APK
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
