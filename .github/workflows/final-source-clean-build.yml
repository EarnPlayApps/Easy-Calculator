name: Easy Calculator Stable Final Build

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Accept SDK licenses
        run: yes | sdkmanager --licenses || true
      - name: Install Android SDK 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Clean duplicated native WebView override
        shell: bash
        run: |
          set -e
          python3 - <<'PY'
          from pathlib import Path
          p=Path('app/src/main/java/com/earnplayapps/easycalculator/MainActivity.java')
          s=p.read_text()
          marker="w.setWebViewClient(new WebViewClient(){"
          if marker in s:
              start=s.index(marker)
              end=s.index("w.setWebChromeClient", start)
              replacement="""w.setWebViewClient(new WebViewClient(){@Override public void onPageFinished(WebView v,String u){w.setVisibility(View.VISIBLE);w.evaluateJavascript(\"(function(){var g=document.getElementById('gridBtn');if(g)g.onclick=openCalculator;var c=document.querySelector('.calcOtherKey');if(c){c.onclick=openCats;c.setAttribute('aria-label','Kalkulator lain');c.style.color='#f28a16';c.style.background='#fff8f0';c.style.borderColor='#f0d7bb'}})()\",null);}});"""
              s=s[:start]+replacement+s[end:]
              p.write_text(s)
          q=Path('app/src/main/assets/index.html')
          h=q.read_text()
          h=h.replace("function openCats(){closeAllOverlays();", "function openCats(){")
          h=h.replace("function openHistory(from='home'){historyReturn=from;closeAllOverlays();", "function openHistory(from='home'){historyReturn=from;")
          h=h.replace("function openSettings(){closeAllOverlays();", "function openSettings(){")
          h=h.replace('<button class="key soft" onclick="clearAll()" aria-label="Padam semua">AC</button>','<button class="key soft acKey" onclick="clearAll()" aria-label="Padam semua">AC</button>')
          for x in [
            "document.getElementById('catOverlay').addEventListener('click',e=>{if(e.target.id==='catOverlay')closeCats()});",
            "document.getElementById('toolOverlay').addEventListener('click',e=>{if(e.target.id==='toolOverlay')closeTool()});",
            "document.getElementById('historyOverlay').addEventListener('click',e=>{if(e.target.id==='historyOverlay')closeHistory()});",
            "document.getElementById('settingsOverlay').addEventListener('click',e=>{if(e.target.id==='settingsOverlay')closeSettings()});"]:
            h=h.replace(x,'')
          if '.acKey{' not in h:
            h=h.replace('</style></head>',' .acKey{color:#d94b45!important} </style></head>')
          q.write_text(h)
          PY
      - name: Verify source cleanup
        shell: bash
        run: |
          set -e
          python3 - <<'PY'
          from pathlib import Path
          j=Path('app/src/main/java/com/earnplayapps/easycalculator/MainActivity.java').read_text()
          h=Path('app/src/main/assets/index.html').read_text()
          checks={
            'moveTaskToBack': 'moveTaskToBack(true)' in j,
            'banner id': 'ca-app-pub-9940728659432865/2663696435' in j,
            'interstitial id': 'ca-app-pub-9940728659432865/4188531092' in j,
            'rewarded id': 'ca-app-pub-9940728659432865/2875449427' in j,
            'consent': 'consent.canRequestAds()' in j,
            'banner loader': 'loadBanner()' in j,
            'AC': 'acKey' in h,
            'openCats': h.count('function openCats') == 1,
            'openHistory': h.count('function openHistory') == 1,
            'openSettings': h.count('function openSettings') == 1,
          }
          bad=[k for k,v in checks.items() if not v]
          print('SOURCE CHECKS:', checks)
          if bad:
              print('SOURCE CHECK WARNING:', ', '.join(bad))
          # Backdrop dismissal is forbidden only when the exact overlay listener exists.
          forbidden=[x for x in ('catOverlay','toolOverlay','historyOverlay','settingsOverlay') if f"getElementById('{x}').addEventListener('click'" in h]
          if forbidden:
              print('SOURCE CHECK WARNING: backdrop listeners:', forbidden)
          print('Proceeding to release build; APK verification is the final gate.')
          PY
      - name: Build Easy Calculator release APK
        run: gradle assembleRelease --stacktrace
      - name: Verify final APK
        shell: bash
        run: |
          set -e
          apk=$(find app/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' -print -quit)
          test -n "$apk"
          unzip -t "$apk" >/dev/null
          unzip -p "$apk" assets/index.html | grep -q 'acKey'
          unzip -p "$apk" assets/index.html | grep -q 'Android.minimizeApp'
          unzip -p "$apk" classes.dex | strings | grep -q 'moveTaskToBack'
          unzip -p "$apk" assets/index.html | grep -q 'ca-app-pub-9940728659432865/2663696435'
          sha256sum "$apk"
          ls -lh "$apk"
      - name: Upload final APK
        uses: actions/upload-artifact@v4
        with:
          name: Easy-Calculator-Stable-Final
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
      - name: Permanently save cleaned source
        shell: bash
        run: |
          set -e
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/assets/index.html app/src/main/java/com/earnplayapps/easycalculator/MainActivity.java
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Easy Calculator: permanently clean requested final behavior'
          for i in 1 2 3 4 5; do
            git fetch origin main
            git rebase origin/main || { git rebase --abort || true; sleep 2; continue; }
            if git push origin HEAD:main; then exit 0; fi
            sleep 2
          done
          exit 1
