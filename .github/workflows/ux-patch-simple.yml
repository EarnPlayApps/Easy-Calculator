name: Easy Calculator UX Patch Simple
on:
  push:
    branches: [ main ]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Patch
        shell: bash
        run: |
          set -e
          python3 - <<'PY'
          from pathlib import Path
          p=Path('app/src/main/assets/index.html')
          s=p.read_text()
          s=s.replace("document.getElementById('resizeBtn').onclick=()=>document.documentElement.classList.toggle('wideView');","document.getElementById('resizeBtn').onclick=()=>{if(window.Android&&Android.minimizeApp)Android.minimizeApp();else document.documentElement.classList.toggle('wideView')};")
          if 'function backFromHistory()' not in s:
              s=s.replace('<button class="close" onclick="closeHistory()">×</button></div><div id="historyList"','<button class="backBtn" onclick="backFromHistory()" type="button">← Kembali</button><button class="close" onclick="closeHistory()">×</button></div><div id="historyList"')
              s=s.replace('function openHistory(){','let historyReturn=\'home\';function backFromHistory(){closeHistory();if(historyReturn===\'settings\')openSettings()}function openHistory(from=\'home\'){historyReturn=from;')
          s=s.replace('onclick="openHistory();closeSettings()">Lihat History','onclick="openHistory(\'settings\')">Lihat History')
          if '.backBtn{' not in s:s=s.replace('</style>','.backBtn{height:36px;border:1px solid var(--line);background:#f7f8fb;color:#526078;border-radius:11px;padding:0 12px;font-size:12px;font-weight:800}.historyModal .mhead{grid-template-columns:1fr auto auto!important}</style>',1)
          p.write_text(s)
          j=Path('app/src/main/java/com/earnplayapps/easycalculator/MainActivity.java')
          t=j.read_text()
          if 'void minimizeApp()' not in t:t=t.replace('@JavascriptInterface public void showRewardedAd(){runOnUiThread(()->showReward());}','@JavascriptInterface public void showRewardedAd(){runOnUiThread(()->showReward());}\n  @JavascriptInterface public void minimizeApp(){runOnUiThread(()->{try{moveTaskToBack(true);}catch(Exception ignored){}});}',1)
          j.write_text(t)
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add app/src/main/assets/index.html app/src/main/java/com/earnplayapps/easycalculator/MainActivity.java
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Easy Calculator: finalize minimize and history back"
          git push origin HEAD:main