name: Easy Calculator APK Build

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Accept SDK licenses
        run: yes | sdkmanager --licenses || true

      - name: Install Android SDK 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.13'

      - name: Diagnose and build debug APK
        id: debug_build
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          {
            echo '=== JAVA ==='
            java -version
            echo '=== GRADLE ==='
            gradle --version
            echo '=== PROJECTS ==='
            gradle projects --stacktrace
            echo '=== AAR METADATA ==='
            gradle :app:checkDebugAarMetadata --stacktrace --info
            echo '=== RESOURCES ==='
            gradle :app:processDebugResources --stacktrace --info
            echo '=== JAVA COMPILE ==='
            gradle :app:compileDebugJavaWithJavac --stacktrace --info
            echo '=== FULL DEBUG BUILD ==='
            gradle :app:assembleDebug --stacktrace --info
          } 2>&1 | tee build-debug.log

      - name: Upload exact build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: easy-calculator-build-diagnostic-log
          path: build-debug.log
          if-no-files-found: error

      - name: Stop if debug build failed
        if: steps.debug_build.outcome == 'failure'
        run: exit 1

      - name: Build release APK (real AdMob)
        run: gradle assembleRelease --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: easy-calculator-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload personal AdMob APK
        uses: actions/upload-artifact@v4
        with:
          name: Easy-Calculator-Personal-AdMob
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
