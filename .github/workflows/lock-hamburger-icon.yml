name: Easy Calculator hamburger SVG lock
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  fix:
    if: ${{ !contains(github.event.head_commit.message, 'Lock Easy Calculator hamburger SVG') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Lock hamburger icon
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('app/src/main/assets/index.html')
          s=p.read_text(encoding='utf-8')
          s,n=re.subn(r'<button class="hamb" id="hamb" aria-label="Menu">.*?</button>', '<button class="hamb" id="hamb" aria-label="Menu"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>', s, count=1, flags=re.S)
          if n!=1: raise SystemExit('hamburger button not found')
          old='.hamb i{display:block;width:18px;height:2px;min-height:2px;background:#263044;border-radius:4px;flex:none}'
          new='.hamb svg{width:20px;height:20px;display:block;fill:none;stroke:#263044;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}'
          if old not in s: raise SystemExit('hamburger CSS not found')
          s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit and remove workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/assets/index.html
          git rm .github/workflows/lock-hamburger-icon.yml
          git commit -m 'Lock Easy Calculator hamburger SVG'
          git push
