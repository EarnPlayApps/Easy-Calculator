name: Easy Calculator Build Diagnosis

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Accept SDK licenses
        run: yes | sdkmanager --licenses || true

      - name: Install Android SDK 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.13'

      - name: Capture exact build failure
        shell: bash
        run: |
          set +e
          mkdir -p diagnosis
          echo '=== JAVA ===' | tee diagnosis/java-version.txt
          java -version 2>&1 | tee -a diagnosis/java-version.txt
          echo '=== GRADLE ===' | tee diagnosis/gradle-version.txt
          gradle --version 2>&1 | tee -a diagnosis/gradle-version.txt
          echo '=== DEBUG BUILD ===' | tee diagnosis/build.log
          gradle :app:assembleDebug --stacktrace --console=plain 2>&1 | tee -a diagnosis/build.log
          BUILD=${PIPESTATUS[0]}
          echo "BUILD_EXIT=$BUILD" | tee -a diagnosis/build.log
          echo '=== RELEASE BUILD ===' | tee diagnosis/release-build.log
          gradle :app:assembleRelease --stacktrace --console=plain 2>&1 | tee -a diagnosis/release-build.log
          RELEASE=${PIPESTATUS[0]}
          echo "RELEASE_EXIT=$RELEASE" | tee -a diagnosis/release-build.log
          echo "DEBUG=$BUILD RELEASE=$RELEASE" | tee diagnosis/result.txt
          if [ "$RELEASE" -ne 0 ]; then exit "$RELEASE"; fi
          if [ "$BUILD" -ne 0 ]; then exit "$BUILD"; fi

      - name: Upload diagnosis logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Easy-Calculator-build-diagnosis
          path: diagnosis/
          if-no-files-found: error
