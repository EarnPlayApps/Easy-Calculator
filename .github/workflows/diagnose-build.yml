name: Easy Calculator Build Diagnosis

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Accept SDK licenses
        run: yes | sdkmanager --licenses || true

      - name: Install Android SDK 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.13'

      - name: Capture exact build failure
        shell: bash
        run: |
          set +e
          mkdir -p diagnosis
          echo '=== JAVA ===' | tee diagnosis/java-version.txt
          java -version 2>&1 | tee -a diagnosis/java-version.txt
          echo '=== GRADLE ===' | tee diagnosis/gradle-version.txt
          gradle --version 2>&1 | tee -a diagnosis/gradle-version.txt
          echo '=== AAR METADATA ===' | tee diagnosis/aar.log
          gradle :app:checkDebugAarMetadata --stacktrace --console=plain 2>&1 | tee -a diagnosis/aar.log
          AAR=${PIPESTATUS[0]}
          echo "AAR_EXIT=$AAR" | tee -a diagnosis/aar.log
          echo '=== RESOURCES ===' | tee diagnosis/resources.log
          gradle :app:processDebugResources --stacktrace --console=plain 2>&1 | tee -a diagnosis/resources.log
          RES=${PIPESTATUS[0]}
          echo "RES_EXIT=$RES" | tee -a diagnosis/resources.log
          echo '=== JAVAC ===' | tee diagnosis/javac.log
          gradle :app:compileDebugJavaWithJavac --stacktrace --console=plain 2>&1 | tee -a diagnosis/javac.log
          JAVAC=${PIPESTATUS[0]}
          echo "JAVAC_EXIT=$JAVAC" | tee -a diagnosis/javac.log
          echo '=== FULL BUILD ===' | tee diagnosis/build.log
          gradle :app:assembleDebug --stacktrace --console=plain 2>&1 | tee -a diagnosis/build.log
          BUILD=${PIPESTATUS[0]}
          echo "BUILD_EXIT=$BUILD" | tee -a diagnosis/build.log
          echo "AAR=$AAR RES=$RES JAVAC=$JAVAC BUILD=$BUILD" | tee diagnosis/result.txt
          if [ "$JAVAC" -ne 0 ]; then exit "$JAVAC"; fi
          if [ "$BUILD" -ne 0 ]; then exit "$BUILD"; fi

      - name: Upload diagnosis logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Easy-Calculator-build-diagnosis
          path: diagnosis/
          if-no-files-found: error
