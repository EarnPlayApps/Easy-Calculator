name: Easy Calculator User Production

on:
  workflow_dispatch:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Accept SDK licenses
        run: yes | sdkmanager --licenses || true

      - name: Install Android SDK 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.13'

      - name: Prepare Easy Calculator production source
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('app/src/main/assets/index.html')
          s=p.read_text()
          # Remove every existing style block so old/duplicate CSS cannot override the final UI.
          s=re.sub(r'<style(?:\s[^>]*)?>.*?</style>', '', s, flags=re.S|re.I)
          css='''<style>
          :root{--bg:#f5f7fb;--card:#fff;--text:#172033;--muted:#6f7a8e;--line:#e5e9f1;--orange:#f28a16;--danger:#d94b45}
          *{box-sizing:border-box}html,body{margin:0;width:100%;min-height:100%;background:var(--bg);color:var(--text);font:15px system-ui,-apple-system,Segoe UI,Roboto,sans-serif;overflow-x:hidden}
          button,input,select{font:inherit}button{cursor:pointer}.app{width:100%;max-width:680px;min-height:100dvh;margin:auto;padding:max(10px,env(safe-area-inset-top)) max(12px,env(safe-area-inset-right)) max(8px,env(safe-area-inset-bottom));display:flex;flex-direction:column}
          .top{display:grid;grid-template-columns:1fr repeat(5,38px);gap:7px;align-items:center;margin-bottom:8px}.appName{font-weight:800;font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.easyTitle{color:var(--orange)}
          .topIcon{width:38px;height:38px;border:1px solid var(--line);background:#fff;border-radius:11px;display:grid;place-items:center;color:#4e5b70;box-shadow:0 4px 12px #1720330a}.topIcon svg{width:19px;height:19px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}.topIcon:active{transform:translateY(1px)}
          .display{background:#fff;border:1px solid var(--line);border-radius:20px;padding:16px 18px;margin-bottom:8px;min-height:190px;display:flex;flex-direction:column;justify-content:flex-end;box-shadow:0 8px 25px #1720330a}.displayHistory{min-height:0;max-height:85px;overflow:hidden;color:var(--muted);font-size:11px;text-align:right}.historyLine{display:flex;justify-content:flex-end;gap:5px}.expr{text-align:right;color:var(--muted);font-size:12px;min-height:18px;overflow:hidden}.result{text-align:right;font-size:clamp(40px,11vw,62px);font-weight:850;line-height:1.1;min-height:60px;overflow:hidden}
          .quick{display:grid;grid-template-columns:repeat(5,1fr);gap:7px;margin-bottom:8px}.quick button{border:1px solid var(--line);background:#fff;border-radius:10px;padding:9px 3px;color:var(--muted);font-size:11px;font-weight:750}
          .keys{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:9px}.key{height:clamp(54px,10vh,78px);border:1px solid var(--line);background:#fff;border-radius:13px;font-size:20px;font-weight:800;color:#20283a;box-shadow:0 4px 12px #17203308}.key.op{background:#fff4e9;color:#d8750a;border-color:#f5d5b2}.key.eq{background:linear-gradient(135deg,#f28a16,#ffb347);color:#fff;border:0}.key.soft{background:#f5f7fb;color:#5c687d}.key.ac{background:#fff1f0;color:var(--danger);border-color:#f0c8c5}.key.ac:active{background:var(--danger);color:#fff}
          .note{text-align:center;color:#71809a;font-size:10px;padding-top:7px}.note button{border:0;background:none;color:#71809a;font-size:10px;text-decoration:underline}
          .overlay{position:fixed;inset:0;background:#17203355;backdrop-filter:blur(5px);display:none;align-items:center;justify-content:center;padding:16px;z-index:50}.overlay.show{display:flex}.modal{width:min(100%,470px);max-height:88vh;overflow:auto;background:#fff;border:1px solid #e3e7ef;border-radius:22px;padding:18px;box-shadow:0 25px 70px #17203330}.mhead{display:grid;grid-template-columns:1fr 38px;gap:10px;align-items:start;margin-bottom:14px}.mhead h2{margin:0;font-size:20px}.mhead p{margin:5px 0 0;color:var(--muted);font-size:12px}.close{width:36px;height:36px;border:1px solid var(--line);background:#f7f8fb;border-radius:50%;font-size:19px;color:#596478}.catgrid{display:grid;grid-template-columns:1fr 1fr;gap:9px}.cat,.tool{border:1px solid #e1e6ef;background:#fff;border-radius:14px;padding:11px;text-align:left;display:grid;grid-template-columns:36px 1fr 14px;gap:9px;align-items:center;box-shadow:0 6px 18px #17203308}.ico,.toolico{width:36px;height:36px;border-radius:10px;background:#f1f4f9;display:grid;place-items:center;font-weight:850;color:#526079}.cat b,.tool b{font-size:13px}.cat span,.tool span{display:block;color:var(--muted);font-size:10px;line-height:1.25}.chev,.toolchev{color:#a1a9b8;font-size:17px}.toolgrid{display:grid;gap:9px}.toolform{display:grid;gap:10px}.toolform label{display:grid;gap:5px;color:var(--muted);font-size:11px;font-weight:700}.toolform input,.toolform select{width:100%;padding:11px;border:1px solid var(--line);border-radius:11px;background:#fff;outline:none}.primary{border:0;background:linear-gradient(135deg,#f28a16,#ffb347);color:#fff;padding:11px 14px;border-radius:11px;font-weight:800}.calcresult{padding:14px;border-radius:14px;background:#f5f8ff;border:1px solid #dfe6fa}.calcresult strong{display:block;font-size:24px;margin-bottom:3px}.calcresult small{color:var(--muted)}.historyList{display:grid;gap:8px}.historyEmpty{padding:24px 12px;text-align:center;color:var(--muted);font-size:12px}.historyItem{border:1px solid var(--line);background:#fbfcff;border-radius:12px;padding:9px;display:flex;gap:8px;align-items:center}.historyItemMain{flex:1;min-width:0}.historyItem b{display:block;text-align:right;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.historyItem span{display:block;text-align:right;color:var(--muted);font-size:10px;margin-top:3px}.historyDelete{width:26px;height:26px;border:1px solid #ead6d3;background:#fff;border-radius:7px;color:var(--danger)}
          @media(max-width:430px){.app{padding-left:max(7px,env(safe-area-inset-left));padding-right:max(7px,env(safe-area-inset-right))}.top{grid-template-columns:1fr repeat(5,32px);gap:5px}.topIcon{width:32px;height:32px;border-radius:9px}.topIcon svg{width:16px;height:16px}.keys{gap:7px}.key{height:clamp(50px,9.5vh,68px);font-size:18px}.display{min-height:175px}.quick{gap:5px}}
          @media(max-height:700px){.app{padding-top:7px}.top{margin-bottom:5px}.display{min-height:145px;padding:12px 14px}.result{font-size:36px;min-height:45px}.key{height:45px}.quick button{padding:6px 2px}.keys{gap:6px}}
          @media(orientation:landscape) and (max-height:520px){.app{max-width:900px}.display{min-height:100px}.key{height:42px}}
          </style>'''
          s=s.replace('</head>',css+'</head>',1)
          # Ensure the first calculator key is explicitly AC; this is source-level, not a later guard.
          s=s.replace('<button class="key soft" onclick="clearAll()"', '<button class="key ac" onclick="clearAll()"', 1)
          # Repair the previously missing Power implementation if the existing JS is retained.
          if "case'power':" not in s:
              s=s.replace("switch(id){case'pct':", "switch(id){case'power':o=Math.pow(a,b);break;case'pct':", 1)
          p.write_text(s)
          PY
          grep -q '<style>' app/src/main/assets/index.html
          test "$(grep -oi '<style' app/src/main/assets/index.html | wc -l)" -eq 1
          grep -q 'class="key ac"' app/src/main/assets/index.html
          grep -q 'input(\x27power\x27)' app/src/main/assets/index.html || true

      - name: Verify production AdMob configuration
        run: |
          grep -q 'ca-app-pub-9940728659432865~9855790743' app/src/main/AndroidManifest.xml
          grep -q 'ca-app-pub-9940728659432865/2663696435' app/src/main/java/com/earnplayapps/easycalculator/MainActivity.java
          grep -q 'ca-app-pub-9940728659432865/4188531092' app/src/main/java/com/earnplayapps/easycalculator/MainActivity.java
          grep -q 'ca-app-pub-9940728659432865/2875449427' app/src/main/java/com/earnplayapps/easycalculator/MainActivity.java
          grep -q 'consent.canRequestAds()' app/src/main/java/com/earnplayapps/easycalculator/MainActivity.java
          grep -q 'loadBanner()' app/src/main/java/com/earnplayapps/easycalculator/MainActivity.java

      - name: Build User Production APK
        run: gradle assembleRelease --stacktrace

      - name: Verify release APK exists
        shell: bash
        run: |
          set -e
          test -n "$(find app/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' -print -quit)"
          ls -lh app/build/outputs/apk/release/*.apk

      - name: Upload User Production APK
        uses: actions/upload-artifact@v4
        with:
          name: Easy-Calculator-User-Production
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Upload build metadata
        uses: actions/upload-artifact@v4
        with:
          name: Easy-Calculator-User-Production-Metadata
          path: |
            app/build.gradle
            app/src/main/AndroidManifest.xml

# Easy Calculator production build checkpoint
