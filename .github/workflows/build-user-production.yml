name: Easy Calculator User Production

on:
  workflow_dispatch:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Accept SDK licenses
        run: yes | sdkmanager --licenses || true

      - name: Install Android SDK 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.13'

      - name: Prepare Easy Calculator production source
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('app/src/main/assets/index.html')
          s=p.read_text()
          s=re.sub(r'<style(?:\s[^>]*)?>.*?</style>', '', s, flags=re.S|re.I)
          css='''<style>
          :root{--bg:#f5f7fb;--card:#fff;--text:#172033;--muted:#6f7a8e;--line:#e5e9f1;--orange:#f28a16;--danger:#d94b45}
          *{box-sizing:border-box}html,body{margin:0;width:100%;min-height:100%;background:var(--bg);color:var(--text);font:15px system-ui,-apple-system,Segoe UI,Roboto,sans-serif;overflow-x:hidden}button,input,select{font:inherit}button{cursor:pointer}
          .app{width:100%;max-width:680px;min-height:100dvh;margin:auto;padding:max(10px,env(safe-area-inset-top)) max(12px,env(safe-area-inset-right)) max(8px,env(safe-area-inset-bottom));display:flex;flex-direction:column}
          .top{display:grid!important;grid-template-columns:minmax(0,1fr) repeat(5,38px)!important;gap:7px!important;align-items:center!important;width:100%!important;margin:0 0 9px!important;padding:0!important}.appName{font-weight:900;font-size:20px;letter-spacing:-.6px;line-height:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;position:relative;padding:5px 0 7px}.appName:after{content:'CALCULATE  •  CONVERT  •  SIMPLIFY';display:block;font-size:7px;letter-spacing:1.1px;color:#8993a6;font-weight:800;margin-top:5px}.easyTitle{background:linear-gradient(135deg,#e87505,#f7a12e);-webkit-background-clip:text;background-clip:text;color:transparent}
          .topIcon{width:38px!important;height:38px!important;min-width:38px!important;min-height:38px!important;border:1px solid var(--line)!important;background:#fff!important;border-radius:12px!important;display:grid!important;place-items:center!important;color:#526078!important;box-shadow:0 5px 15px #1720330b!important;padding:0!important}.topIcon svg{width:19px;height:19px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}.topIcon:active{transform:translateY(1px);background:#fff4e9!important;color:var(--orange)!important}
          .display{background:#fff;border:1px solid var(--line);border-radius:20px;padding:15px 17px;margin-bottom:8px;min-height:190px;display:flex;flex-direction:column;justify-content:flex-end;box-shadow:0 8px 25px #1720330a;overflow:hidden}.displayHistory{min-height:0;max-height:82px;overflow:hidden;color:var(--muted);font-size:11px;text-align:right}.historyLine{display:flex;justify-content:flex-end;gap:5px}.expr{text-align:right;color:var(--muted);font-size:12px;min-height:18px;overflow:hidden}.result{text-align:right;font-size:clamp(40px,11vw,62px);font-weight:850;line-height:1.1;min-height:60px;overflow:hidden}
          .quick{display:grid;grid-template-columns:repeat(5,1fr);gap:7px;margin-bottom:8px}.quick button{border:1px solid var(--line);background:#fff;border-radius:10px;padding:9px 3px;color:var(--muted);font-size:11px;font-weight:750}.keys{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:9px}.key{height:clamp(54px,10vh,78px);min-width:0;border:1px solid var(--line);background:#fff;border-radius:13px;font-size:20px;font-weight:800;color:#20283a;box-shadow:0 4px 12px #17203308}.key.op{background:#fff4e9;color:#d8750a;border-color:#f5d5b2}.key.eq{background:linear-gradient(135deg,#f28a16,#ffb347);color:#fff;border:0}.key.soft{background:#f5f7fb;color:#5c687d}.key.ac{background:#fff1f0;color:var(--danger);border-color:#f0c8c5}.key.ac:active{background:var(--danger);color:#fff}
          .note{text-align:center;color:#71809a;font-size:10px;padding-top:7px}.note button{border:0;background:none;color:#71809a;font-size:10px;text-decoration:underline}.overlay{position:fixed;inset:0;background:#17203355;backdrop-filter:blur(5px);display:none;align-items:center;justify-content:center;padding:16px;z-index:50}.overlay.show{display:flex}.modal{width:min(100%,470px);max-height:88vh;overflow:auto;background:#fff;border:1px solid #e3e7ef;border-radius:22px;padding:18px;box-shadow:0 25px 70px #17203330}.mhead{display:grid;grid-template-columns:1fr 38px;gap:10px;align-items:start;margin-bottom:14px}.mhead h2{margin:0;font-size:20px}.mhead p{margin:5px 0 0;color:var(--muted);font-size:12px}.close{width:36px;height:36px;border:1px solid var(--line);background:#f7f8fb;border-radius:50%;font-size:19px;color:#596478}.catgrid{display:grid;grid-template-columns:1fr 1fr;gap:9px}.cat,.tool{border:1px solid #e1e6ef;background:#fff;border-radius:14px;padding:11px;text-align:left;display:grid;grid-template-columns:38px 1fr 14px;gap:9px;align-items:center;box-shadow:0 6px 18px #17203308}.ico,.toolico{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;font-weight:900;font-size:15px}.blue{background:#edf3ff;color:#3767ff}.violet{background:#f2edff;color:#8259d9}.green{background:#eaf8f1;color:#169b62}.pink{background:#fff0f5;color:#e75b88}.cyan{background:#eaf9fc;color:#159bb5}.yellow{background:#fff7df;color:#c88900}.orange{background:#fff1e4;color:#d8750a}.gray{background:#f0f3f7;color:#68748a}.cat b,.tool b{font-size:13px}.cat span,.tool span{display:block;color:var(--muted);font-size:10px;line-height:1.25;margin-top:2px}.chev,.toolchev{color:#a1a9b8;font-size:17px}.toolgrid{display:grid;gap:9px}.toolform{display:grid;gap:10px}.toolform label{display:grid;gap:5px;color:var(--muted);font-size:11px;font-weight:700}.toolform input,.toolform select{width:100%;padding:11px;border:1px solid var(--line);border-radius:11px;background:#fff;outline:none}.primary{border:0;background:linear-gradient(135deg,#f28a16,#ffb347);color:#fff;padding:11px 14px;border-radius:11px;font-weight:800}.calcresult{padding:14px;border-radius:14px;background:#f5f8ff;border:1px solid #dfe6fa}.calcresult strong{display:block;font-size:24px;margin-bottom:3px}.calcresult small{color:var(--muted)}.historyList{display:grid;gap:8px}.historyEmpty{padding:24px 12px;text-align:center;color:var(--muted);font-size:12px}.historyItem{border:1px solid var(--line);background:#fbfcff;border-radius:12px;padding:9px;display:flex;gap:8px;align-items:center}.historyItemMain{flex:1;min-width:0}.historyItem b{display:block;text-align:right;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.historyItem span{display:block;text-align:right;color:var(--muted);font-size:10px;margin-top:3px}.historyDelete{width:26px;height:26px;border:1px solid #ead6d3;background:#fff;border-radius:7px;color:var(--danger)}
          @media(max-width:430px){.app{padding-left:max(7px,env(safe-area-inset-left));padding-right:max(7px,env(safe-area-inset-right))}.top{grid-template-columns:minmax(0,1fr) repeat(5,32px)!important;gap:5px!important}.topIcon{width:32px!important;height:32px!important;border-radius:9px!important}.topIcon svg{width:16px;height:16px}.appName{font-size:18px}.keys{gap:7px}.key{height:clamp(50px,9.5vh,68px);font-size:18px}.display{min-height:175px}.quick{gap:5px}}
          @media(max-height:700px){.app{padding-top:7px}.top{margin-bottom:5px!important}.display{min-height:145px;padding:12px 14px}.result{font-size:36px;min-height:45px}.key{height:45px}.quick button{padding:6px 2px}.keys{gap:6px}}
          @media(orientation:landscape) and (max-height:520px){.app{max-width:900px}.display{min-height:100px}.key{height:42px}}
          </style>'''
          s=s.replace('</head>',css+'</head>',1)
          old="function openCat(name){currentCat=name;document.getElementById('mode').textContent='Calculator · '+name;closeCats();renderTools()}"
          new="function openCat(name){currentCat=name;var mode=document.getElementById('mode');if(mode)mode.textContent='Calculator · '+name;closeCats();renderTools()}"
          if old in s:s=s.replace(old,new,1)
          else:s=s.replace("document.getElementById('mode').textContent='Calculator · '+name;closeCats();renderTools()","var mode=document.getElementById('mode');if(mode)mode.textContent='Calculator · '+name;closeCats();renderTools()",1)
          s=s.replace('<button class="key soft" onclick="clearAll()"','<button class="key ac" onclick="clearAll()"',1)
          p.write_text(s)
          PY
          set -e
          test "$(grep -oi '<style' app/src/main/assets/index.html | wc -l)" -eq 1
          grep -q 'var mode=document.getElementById('\''mode'\'');if(mode)' app/src/main/assets/index.html
          grep -q 'class="key ac"' app/src/main/assets/index.html

      - name: Verify production AdMob configuration
        run: |
          grep -q 'ca-app-pub-9940728659432865~9855790743' app/src/main/AndroidManifest.xml
          grep -q 'ca-app-pub-9940728659432865/2663696435' app/src/main/java/com/earnplayapps/easycalculator/MainActivity.java
          grep -q 'ca-app-pub-9940728659432865/4188531092' app/src/main/java/com/earnplayapps/easycalculator/MainActivity.java
          grep -q 'ca-app-pub-9940728659432865/2875449427' app/src/main/java/com/earnplayapps/easycalculator/MainActivity.java
          grep -q 'consent.canRequestAds()' app/src/main/java/com/earnplayapps/easycalculator/MainActivity.java
          grep -q 'loadBanner()' app/src/main/java/com/earnplayapps/easycalculator/MainActivity.java

      - name: Build User Production APK
        run: gradle assembleRelease --stacktrace

      - name: Verify release APK exists
        shell: bash
        run: |
          set -e
          apk=$(find app/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' -print -quit)
          test -n "$apk"
          ls -lh "$apk"
          sha256sum "$apk"

      - name: Upload User Production APK
        uses: actions/upload-artifact@v4
        with:
          name: Easy-Calculator-User-Production
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Upload build metadata
        uses: actions/upload-artifact@v4
        with:
          name: Easy-Calculator-User-Production-Metadata
          path: |
            app/build.gradle
            app/src/main/AndroidManifest.xml

# Easy Calculator production build checkpoint
