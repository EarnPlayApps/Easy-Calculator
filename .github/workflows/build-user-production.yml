name: Easy Calculator User Production

on:
  workflow_dispatch:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Accept SDK licenses
        run: yes | sdkmanager --licenses || true

      - name: Install Android SDK 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.13'

      - name: Prepare User Production build
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('app/build.gradle')
          s=p.read_text()
          s=s.replace("versionCode 1; versionName '1.0'", "versionCode 2; versionName '1.0.1'")
          p.write_text(s)
          PY

      - name: Apply final calculator UI guard
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('app/src/main/assets/index.html')
          s=p.read_text()
          marker='<!-- EASY_CALCULATOR_PRODUCTION_UI_GUARD -->'
          css='''<style id="production-ui-guard">\n.keys .key:first-child{color:#d94b45!important;background:#fff1f0!important;border-color:#f0c8c5!important}\n.keys .key:first-child:active{background:#d94b45!important;color:#fff!important}\n</style>'''
          if marker not in s:
              s=s.replace('</head>', marker+'\n'+css+'\n</head>', 1)
          p.write_text(s)
          PY

      - name: Verify production AdMob configuration
        run: |
          grep -q 'ca-app-pub-9940728659432865~9855790743' app/src/main/AndroidManifest.xml
          grep -q 'ca-app-pub-9940728659432865/2663696435' app/src/main/java/com/earnplayapps/easycalculator/MainActivity.java
          grep -q 'ca-app-pub-9940728659432865/4188531092' app/src/main/java/com/earnplayapps/easycalculator/MainActivity.java
          grep -q 'ca-app-pub-9940728659432865/2875449427' app/src/main/java/com/earnplayapps/easycalculator/MainActivity.java

      - name: Build User Production APK
        run: gradle assembleRelease --stacktrace

      - name: Verify release APK exists
        shell: bash
        run: |
          set -e
          test -n "$(find app/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' -print -quit)"
          ls -lh app/build/outputs/apk/release/*.apk

      - name: Upload User Production APK
        uses: actions/upload-artifact@v4
        with:
          name: Easy-Calculator-User-Production
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Upload build metadata
        uses: actions/upload-artifact@v4
        with:
          name: Easy-Calculator-User-Production-Metadata
          path: |
            app/build.gradle
            app/src/main/AndroidManifest.xml

# User Production build flow checkpoint
