name: Easy Calculator User Production

on:
  workflow_dispatch:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Accept SDK licenses
        run: yes | sdkmanager --licenses || true

      - name: Install Android SDK 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.13'

      - name: Prepare Easy Calculator production source
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('app/src/main/assets/index.html')
          s=p.read_text()
          # Keep the existing production layout; apply only the requested final behavior fixes.
          if '.key.acKey{' not in s:
              s=s.replace('.calcOtherKey{color:#f28a16!important;', '.key.acKey{color:#d94b45!important;background:#fff7f6!important;border-color:#ead6d3!important}.key.acKey:active{background:#d94b45!important;color:#fff!important}.calcOtherKey{color:#f28a16!important;', 1)
          s=s.replace('<button class="key soft" onclick="clearAll()" aria-label="Padam semua">AC</button>', '<button class="key soft acKey" onclick="clearAll()" aria-label="Padam semua">AC</button>')
          s=re.sub(r"document\.getElementById\('resizeBtn'\)\.onclick=\(\)=>document\.documentElement\.classList\.toggle\('wideView'\);", "document.getElementById('resizeBtn').onclick=()=>{if(window.Android&&Android.minimizeApp){Android.minimizeApp()}else{document.documentElement.classList.toggle('wideView')}};", s)
          s=s.replace("document.getElementById('gridBtn').onclick=openCats;", "document.getElementById('gridBtn').onclick=openCalculator;")
          p.write_text(s)
          PY
          set -e
          grep -q 'class="key soft acKey"' app/src/main/assets/index.html
          grep -q 'Android.minimizeApp' app/src/main/assets/index.html
          grep -q "document.getElementById('gridBtn').onclick=openCalculator" app/src/main/assets/index.html

      - name: Verify production AdMob configuration
        run: |
          grep -q 'ca-app-pub-9940728659432865~9855790743' app/src/main/AndroidManifest.xml
          grep -q 'ca-app-pub-9940728659432865/2663696435' app/src/main/java/com/earnplayapps/easycalculator/MainActivity.java
          grep -q 'ca-app-pub-9940728659432865/4188531092' app/src/main/java/com/earnplayapps/easycalculator/MainActivity.java
          grep -q 'ca-app-pub-9940728659432865/2875449427' app/src/main/java/com/earnplayapps/easycalculator/MainActivity.java
          grep -q 'consent.canRequestAds()' app/src/main/java/com/earnplayapps/easycalculator/MainActivity.java
          grep -q 'loadBanner()' app/src/main/java/com/earnplayapps/easycalculator/MainActivity.java
          grep -q 'moveTaskToBack' app/src/main/java/com/earnplayapps/easycalculator/MainActivity.java

      - name: Build User Production APK
        run: gradle assembleRelease --stacktrace

      - name: Verify release APK exists and contains final fixes
        shell: bash
        run: |
          set -e
          apk=$(find app/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' -print -quit)
          test -n "$apk"
          unzip -t "$apk" >/dev/null
          unzip -p "$apk" assets/index.html | grep -q 'class="key soft acKey"'
          unzip -p "$apk" assets/index.html | grep -q 'Android.minimizeApp'
          unzip -p "$apk" assets/index.html | grep -q "document.getElementById('gridBtn').onclick=openCalculator"
          unzip -p "$apk" classes.dex | strings | grep -q 'moveTaskToBack'
          ls -lh "$apk"
          sha256sum "$apk"

      - name: Upload User Production APK
        uses: actions/upload-artifact@v4
        with:
          name: Easy-Calculator-User-Production
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Upload build metadata
        uses: actions/upload-artifact@v4
        with:
          name: Easy-Calculator-User-Production-Metadata
          path: |
            app/build.gradle
            app/src/main/AndroidManifest.xml

# Easy Calculator production build checkpoint
