plugins { id 'com.android.application' }

android {
    namespace 'com.earnplayapps.easycalculator'
    compileSdk 36

    buildFeatures { buildConfig true }

    defaultConfig {
        applicationId 'com.earnplayapps.easycalculator'
        minSdk 23
        targetSdk 36
        versionCode 3
        versionName '1.0.2'
    }

    buildTypes {
        release {
            // Explicitly produce a normal installable release APK.
            // Keep v1 for older Android compatibility and v2 for Android 7+.
            signingConfig signingConfigs.debug
            minifyEnabled false
            shrinkResources false
            debuggable false
        }
    }
}

dependencies {
    implementation 'com.google.android.gms:play-services-ads:25.4.0'
    implementation 'com.google.android.ump:user-messaging-platform:4.0.0'
}
